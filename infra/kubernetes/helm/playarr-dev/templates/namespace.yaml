{{- /* The chart owns its Namespace so a GitOps repository can set labels and annotations through values. */}}
{{- $ns := .Values.namespace | default dict }}
{{- if $ns.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  {{- with $ns.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $ns.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
