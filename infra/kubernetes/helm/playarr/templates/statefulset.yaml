# One Playarr server (API and background workers in one process, role `all`)
# with its SQLite database on a PersistentVolumeClaim. Playarr is SQLite-only
# (ADR 0002), so this is deliberately a single replica: SQLite does not
# support several pods writing one database. Multi-node deployments run
# several independent releases, each with its own database, that synchronise
# through peer sync.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "playarr.fullname" . }}
  labels:
    {{- include "playarr.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  serviceName: {{ include "playarr.fullname" . }}
  selector:
    matchLabels:
      {{- include "playarr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "playarr.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "playarr.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: playarr
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PLAYARR_ROLE
              value: "all"
            - name: DATABASE_URL
              value: "sqlite://{{ .Values.persistence.mountPath }}/playarr.db"
            - name: PLAYARR_ARTWORK_CACHE_DIR
              value: "{{ .Values.persistence.mountPath }}/cache/artwork"
            # Converted downloads are staging files on their own capped scratch volume, never the database volume.
            - name: PLAYARR_DOWNLOAD_DIR
              value: /downloads
            - name: PLAYARR_DOWNLOAD_MAX_BYTES
              # About 90% of the scratch volume, so a job in flight and filesystem overhead still fit (Mi or Gi).
              {{- /* about 90% of the cap, computed in Mi so Mi and Gi both work; never below 1Mi */ -}}
              {{- $size := .Values.downloads.staging.sizeLimit | toString }}
              {{- $mi := 0 }}
              {{- if hasSuffix "Gi" $size }}{{ $mi = mul (trimSuffix "Gi" $size | int) 1024 }}
              {{- else if hasSuffix "Mi" $size }}{{ $mi = (trimSuffix "Mi" $size | int) }}{{ end }}
              {{- if gt $mi 0 }}
              value: {{ printf "%dMi" (max 1 (div (mul $mi 9) 10)) | quote }}
              {{- else }}
              value: {{ $size | quote }}
              {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "playarr.configMapName" . }}
          ports:
            - name: http
              containerPort: {{ .Values.probes.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: {{ .Values.probes.port }}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
            successThreshold: {{ .Values.probes.successThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: {{ .Values.probes.port }}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          lifecycle:
            preStop:
              exec:
                # Give the load balancer / kube-proxy / Endpoints controller
                # time to observe this pod is terminating and stop sending it
                # new traffic before the process receives SIGTERM.
                command: ["/bin/sh", "-c", "sleep {{ .Values.preStopSleepSeconds }}"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: tmp
          emptyDir: {}
        # Converted downloads are short-lived staging (the device keeps its own copy): capped node-local
        # scratch, never the database volume.
        - name: downloads
          emptyDir:
            sizeLimit: {{ .Values.downloads.staging.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
