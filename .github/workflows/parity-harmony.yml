name: "Parity captures: HarmonyOS"

# HarmonyOS parity captures on GitHub-hosted runners (replaces the owner's MacBook while it is away). A Linux job builds the preview
# bundle with the public OpenHarmony SDK (no Huawei login); a Windows job renders it with the public SDK's Windows Previewer, using
# Mesa llvmpipe for OpenGL (hosted VMs have no GPU), signs in fresh as the Device Test account (link code from the app's log, approved
# with the repository secrets), and captures the screens in dark and light. The Linux Previewer cannot render Stage apps ("Linux is
# not supported"), and the macOS one crashes creating a GL context, so Windows is the only host. Pull the result into the legend with
# scripts/harmony-wall/pull-captures.sh.
# Public repository: workflow_dispatch only, no pull_request trigger. The secrets reach one step; no frame that could show the server
# address is ever uploaded.

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device
        type: choice
        options: [tv, phone]
        default: tv
      parts:
        description: TV parts (screens - the captures only; everything - captures, D-pad, key screens, playback)
        type: choice
        options: [screens, dpad, everything]
        default: screens
      checks:
        description: D-pad check ids to run (comma separated; empty runs all non-player checks)
        type: string
        default: ''
      tv_screens:
        description: TV screen IDs as a comma-separated list, or all for the legacy full set
        type: string
        default: all
      skip_player:
        description: Skip the player-controls route while retaining the other full-set captures
        type: boolean
        default: false
      phone_core_only:
        description: Capture and validate the 15 required phone screens, then skip optional diagnostics
        type: boolean
        default: false
      poster:
        description: Round 3 poster mode (Home screen artwork = Covers) frames, TV only
        type: boolean
        default: false
      motion:
        description: Round 3 motion bursts (Home scroll, rails, Filters by swipes), TV only
        type: boolean
        default: false
      rail_patch:
        description: Apply the preview-only MediaRail @Prop patch (turn off to test whether the app needs it)
        type: boolean
        default: true

permissions:
  contents: read

# Hosted walls have no isolated parity account; stable capture (the suite default) needs one.
env:
  PARITY_STABLE: "0"

jobs:
  build:
    name: Build the preview bundle (${{ inputs.device || 'tv' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEVICE: ${{ inputs.device || 'tv' }}
      RAIL_PATCH: ${{ inputs.rail_patch == false && 'no' || 'yes' }}
      WORK: ${{ github.workspace }}/harmony-wall-work
    steps:
      - uses: actions/checkout@v4
      - name: Check capture script syntax
        run: python -m py_compile scripts/harmony-wall/capture.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache OpenHarmony SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/ohos-sdk
          key: ohos-sdk-6.1-release-cli-5.1.0.840
      - name: Install the OpenGL runtime library for the SDK toolchain
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y --no-install-recommends libgl1
      - name: Fetch the OpenHarmony SDK + Command Line Tools
        run: bash clients/harmony/scripts/fetch-sdk.sh
      - name: Configure the @ohos registry
        run: |
          printf 'registry=https://registry.npmjs.org/\n@ohos:registry=https://repo.harmonyos.com/npm/\n' >> ~/.npmrc
          ~/.cache/ohos-sdk/command-line-tools/ohpm/bin/ohpm config set registry https://ohpm.openharmony.cn/ohpm/
      - name: Build the preview bundle
        run: bash scripts/harmony-wall/preview.sh build "$DEVICE"
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-bundle-${{ env.DEVICE }}
          path: |
            ${{ env.WORK }}/app/entry/.preview
            ${{ env.WORK }}/hms-previewer
            ${{ env.WORK }}/hvigor.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  render:
    name: Render on Windows (${{ inputs.device || 'tv' }} ${{ matrix.theme }})
    needs: build
    runs-on: windows-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        # phone: each theme in its own parallel job (one Previewer per colour mode). TV: the screens, one job per theme (a light Home captured after the in-app theme toggle never loaded its posters), the D-pad checks, the key-reached screens and
        # the playback cases run as parallel jobs, each signing in on its own session
        theme: ${{ fromJSON(inputs.device == 'phone' && '["dark","light"]' || ((inputs.tv_screens != 'all') && '["all"]') || (inputs.parts == 'screens' && '["dark","light"]') || (inputs.parts == 'dpad' && '["dpad"]') || '["dark","light","dpad","extra","playback"]') }}
    defaults:
      run:
        shell: bash
    env:
      DEVICE: ${{ inputs.device || 'tv' }}
      TV_SCREENS: ${{ inputs.tv_screens || 'all' }}
      SKIP_PLAYER: ${{ inputs.skip_player == true && 'true' || 'false' }}
      PHONE_CORE_ONLY: ${{ inputs.phone_core_only == true && 'true' || 'false' }}
      MOTION: ${{ inputs.motion == true && 'true' || 'false' }}
      POSTER_MODE: ${{ inputs.poster == true && 'true' || 'false' }}
      MESA_VERSION: 26.2.4
      THEME: ${{ matrix.theme }}
      SDK_BUILD: "31" # the public SDK is 6.1.0.<build>; split so the env-data guard does not read it as an IPv4 address
    steps:
      - uses: actions/checkout@v4
      - name: Check capture script syntax
        run: python -m py_compile scripts/harmony-wall/capture.py
      - uses: actions/download-artifact@v4
        with:
          name: harmony-bundle-${{ env.DEVICE }}
          path: harmony-wall-work
      - name: Cache the Windows Previewer and Mesa
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            sdk/pv
            mesa-x64
          key: harmony-win-previewer-6.1.0-build31-mesa-${{ env.MESA_VERSION }}
      - name: Fetch the Windows Previewer (public SDK) and Mesa llvmpipe
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p sdk
          curl -fL --retry 3 https://repo.huaweicloud.com/harmonyos/os/6.1-Release/ohos-sdk-windows_linux-public.tar.gz | tar xz -C sdk "windows/previewer-windows-x64-6.1.0.${SDK_BUILD}-Release.zip"
          7z x -y -osdk/pv sdk/windows/previewer-windows-x64-*.zip > /dev/null
          curl -fL --retry 3 -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_VERSION/mesa3d-$MESA_VERSION-release-msvc.7z"
          7z x -y -omesa mesa.7z > /dev/null
          cp -R mesa/x64 mesa-x64
      - name: Correct the Previewer HTTP cleanup lifecycle
        run: python scripts/harmony-wall/patch_previewer_http.py sdk/pv/previewer/common/bin/module/net/libhttp.dll
      - name: Put Mesa next to the Previewer
        run: cp -R mesa-x64/. sdk/pv/previewer/common/bin/
      - name: Re-root the absolute paths of the Linux build
        run: |
          W=$(cygpath -m "$GITHUB_WORKSPACE")
          OLD=$(printf '/%s/runner/work/playarr/playarr' home) # the Linux build's workspace
          grep -rIl "$OLD" harmony-wall-work/app/entry/.preview | while read -r f; do
            sed -i "s#$OLD#$W#g" "$f"
          done
      - run: python -m pip install --quiet pillow
      - name: Start the bridge and the Previewer, sign in and capture
        env:
          SERVER_URL: ${{ secrets.PLAYARR_HARMONY_TEST_SERVER_URL || secrets.PLAYARR_TEST_SERVER_URL || secrets.PLAYARR_DEVICE_TEST_SERVER_URL }}
          TEST_USERNAME: ${{ secrets.PLAYARR_DEVICE_TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.PLAYARR_DEVICE_TEST_PASSWORD }}
          HARMONY_PLAYER_FIXTURE_ID: ${{ secrets.HARMONY_PLAYER_FIXTURE_ID }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          CHECKS: ${{ inputs.checks }}
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.5"
        run: |
          W=$(cygpath -m "$GITHUB_WORKSPACE"); I="$W/harmony-wall-work/app/entry/.preview/default/intermediates"
          if [ "$DEVICE" = phone ]; then CTL=40117; WS=40107; DBG=40127; else CTL=40017; WS=40007; DBG=40027; fi
          if [ "$DEVICE" = phone ]; then D=(-device phone -sd 480 -or 1080 2340 -cr 1080 2340 -o portrait); else D=(-device tv -sd 160 -or 1920 1080 -cr 1920 1080 -o landscape); fi
          if [ "$THEME" = light ]; then CM=light; else CM=dark; fi
          cp scripts/sim-vnc/sim_vnc.py scripts/harmony-wall/
          python scripts/harmony-wall/backend_preflight.py --output backend-preflight.json
          python scripts/harmony-wall/fixture_preflight.py --output fixture-preflight.json
          launch() {
            PLAYARR_VNC_PASSWORD=selftest1 python scripts/harmony-wall/harmony_vnc.py --bind 127.0.0.1 --port 5917 --ws $WS --ctl $CTL \
              --debug-port $DBG --cmd-name playarr_cmd --password-env PLAYARR_VNC_PASSWORD > bridge.log 2>&1 &
            # the Previewer connects to the command pipe once, at start: the bridge must have created it by then
            for i in $(seq 1 60); do grep -q 'control on' bridge.log && break; sleep 1; done
            sleep 2
            (cd sdk/pv/previewer/common/bin && ./Previewer.exe -refresh full -sm dynamic -projectID playarrharmony -ts playarr_trace -j "$I/loader_out/default/ets" \
              -s playarr_cmd -cpm false -shape rect "${D[@]}" -n entry -av ACE_2_0 -url pages/Index -d -p $DBG -pages main_pages \
              -arp "$I/res/default" -pm Stage -hsp "$W/harmony-wall-work/hms-previewer/systemHsp" -l en_GB -cm "$CM" -lws $WS \
              -ljPath "$I/loader/default/loader.json" -abp ets/entryability/EntryAbility -abn EntryAbility -staticCard false \
              -foldable false -bn io.playarr.harmony -srmPath "$I/router_map/default/router_map.json" > "$W/previewer.log" 2>&1 &)
            sleep 3; echo started
          }
          launch
          python -u scripts/harmony-wall/capture.py "$DEVICE" capture previewer.log "$THEME"
          if [ "$DEVICE" = tv ]; then
            # the shared suite over the same signed-in Previewer, one part per parallel job
            export HARMONY_CTL=$CTL PREVIEWER_LOG="$W/previewer.log"
            case "$THEME" in
              dpad) node scripts/parity/suite-run.mjs --driver scripts/parity/drivers/harmony.mjs --out suite --only dpad --skip-player ${CHECKS:+--checks "$CHECKS"} --expected scripts/parity/expected.web.json || true ;;
              extra) node scripts/parity/suite-run.mjs --driver scripts/parity/drivers/harmony.mjs --out suite --themes dark --only screens --screens player-controls,actions,filters || true ;;
              playback) node scripts/parity/suite-run.mjs --driver scripts/parity/drivers/harmony.mjs --out suite --only playback --expected /nonexistent.json || true ;;
            esac
          fi
      - name: Upload the captures
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-wall-${{ env.DEVICE }}-${{ github.run_id }}${{ matrix.theme != 'all' && format('-{0}', matrix.theme) || '' }}
          path: |
            capture/dark
            capture/light
            capture/poster
            capture/motion
            capture/build.json
            suite/dpad.json
            suite/playback.json
            suite/dark
          if-no-files-found: error
          retention-days: 14
      - name: Upload the debug frames and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-debug-${{ env.DEVICE }}-${{ matrix.theme }}
          path: |
            backend-preflight.json
            fixture-preflight.json
            capture/_debug
            capture/_rejected-*.png
            capture/backend-preflight-*.json
            capture/build.json
            bridge.log
            previewer.log
          if-no-files-found: ignore
          retention-days: 3
