# =============================================================================
# Release: every Playarr app from one trigger
# =============================================================================
#
# Actions > Release > Run workflow on `main` with `version` (X.Y.Z); the run creates the `vX.Y.Z`
# tag with the release. (The signing environments only admit `main`, so there is no tag trigger.)
# Three stages, each gated on the one before:
#
#   1 tests    fast checks only (lint, typecheck, unit); nothing needing a device, capture or E2E
#   2 builds   signed, repeatable builds of every client, then ONE GitHub Release with the artefacts
#   3 stores   Google Play, TestFlight, playarr.app, then the stores below
#
# Stage 2 builds every app by calling the per-platform workflows (which keep working on their own tags):
#
#   server    backend-release.yml   tarballs, latest.json, ghcr.io/<owner>/playarr:<version>
#   regional  regional-image.yml    ghcr.io/<owner>/playarr:<sha8>
#   android   android-ci.yml        signed sideload APK and its update manifest
#   tv        tv-web-ci.yml         LG webOS IPK, unsigned Samsung Tizen package root
#   roku      (below)               Roku sideload channel zip
#   xbox      xbox-ci.yml           unsigned x64 sideload package (.appx)
#   harmony   harmony-ci.yml        unsigned HarmonyOS HAP
#   linux     (below)               Linux phone client binary tarball
#   macos     (below)               unsigned macOS app zip
#
# Not built here: Fire TV (Vega) needs Amazon's Docker-based SDK image, which release runners do not
# use; its typecheck and jest run in stage 1. Signed macOS needs a Developer ID that does not exist yet.
#
# then creates ONE GitHub Release `v<version>` with every artefact, a combined SHA256SUMS and notes
# a short summary body with the full changelog attached, and only then publishes to the stores:
#
#   play      android-play-internal.yml   Google Play closed testing (alpha)
#   apple     ios-release.yml             iOS and tvOS to TestFlight
#   web       web-ci.yml                  playarr.app (Cloudflare Worker) from the release commit;
#                                         a failed deploy fails the release, the summary reports the version
#   stores    (below)                     Roku, Samsung, LG, Huawei AppGallery, Microsoft Partner Center,
#                                         Amazon Appstore: no accounts yet, each logs "store pending" and succeeds
#
# The server and Android APK are required (playarr.app/downloads serves them from the release); any
# other platform that fails is left out of the release and reported in the summary. `dry_run` builds
# and signs everything but pushes no image, creates no release, publishes nothing and runs no store upload.
#
# Versions: backend/Cargo.toml and clients/android/version.properties must already carry the
# release version (bump them in a PR first, with the Play notes in
# clients/android/fastlane/metadata/android/<locale>/changelogs/<version>.txt). Every other package
# is stamped with it at build time. Android versionCodes: sideload major*1e6+minor*1e3+patch,
# Play (major*1e4+minor*1e2+patch)*1e5+commit count. Apple build number: commit count.attempt,
# above every build already in TestFlight. See docs/deployment/releases.md.
# =============================================================================

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (X.Y.Z)'
        required: true
        type: string
      dry_run:
        description: 'Build and sign everything but publish nothing (no image push, release or store upload)'
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve and check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      apple_build: ${{ steps.version.outputs.apple_build }}
      android_code: ${{ steps.version.outputs.android_code }}
      play_code: ${{ steps.version.outputs.play_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          if [[ "$GITHUB_REF" != refs/heads/main && "$DRY_RUN" != "true" ]]; then
            fail "Run the release from main (the signing environments only admit main); a dry run may use any branch"
          fi
          version="${VERSION_INPUT#v}"
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || fail "Version '$version' must be X.Y.Z"
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          tag="v$version"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' backend/Cargo.toml | head -n 1)"
          [[ "$crate" == "$version" ]] || fail "backend/Cargo.toml is $crate; bump it to $version in a PR before releasing"
          android="$(sed -n 's/^PLAYARR_VERSION_NAME=//p' clients/android/version.properties)"
          [[ "$android" == "$version" ]] || fail "clients/android/version.properties is $android; bump it to $version in a PR before releasing"
          for locale in en-GB en-US; do
            notes="clients/android/fastlane/metadata/android/$locale/changelogs/$version.txt"
            [[ -s "$notes" ]] || fail "Missing Google Play release notes $notes"
          done
          previous="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$tag" | head -n 1 || true)"
          if [[ "$DRY_RUN" != "true" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              fail "Tag $tag already exists; release a new version"
            fi
            if gh release view "$tag" >/dev/null 2>&1; then fail "GitHub Release $tag already exists"; fi
            if [[ -n "$previous" && "$(printf '%s\n%s\n' "$previous" "$tag" | sort -V | tail -n 1)" != "$tag" ]]; then
              fail "$tag is not newer than the latest release $previous"
            fi
          fi
          count="$(git rev-list --count HEAD)"
          (( count < 10000 )) || fail "Commit count $count no longer fits the Apple build number scheme"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "previous_tag=$previous"
            echo "dry_run=$DRY_RUN"
            echo "apple_build=$count.$GITHUB_RUN_ATTEMPT"
            echo "android_code=$((major * 1000000 + minor * 1000 + patch))"
            echo "play_code=$(( (major * 10000 + minor * 100 + patch) * 100000 + count ))"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Test the release notes generator
        run: node --test scripts/release-notes.test.mjs

  # ---------------------------------------------------------------------------
  # Stage 1: fast tests. ci.yml has no workflow_call, so the minimal commands are repeated here.
  # ---------------------------------------------------------------------------
  test-backend:
    name: Test backend (fmt, clippy, unit)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: backend-check
          save-if: false
          cache-directories: ~/.cache/ort.pyke.io
          prefix-key: v1-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features --no-fail-fast

  test-linux-phone:
    name: Test Linux phone client (fmt, clippy, unit)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/linux-mobile
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK, libadwaita and GStreamer development packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/linux-mobile
          shared-key: linux-mobile-check
          save-if: false
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  test-fire-tv:
    name: Test Fire TV (typecheck, jest)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/fire-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: clients/fire-tv/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  test-tv-web:
    name: Test tv-web (lint, typecheck)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/tv-web
    steps:
      - uses: actions/checkout@v4
      # pnpm 11 needs Node >= 22.13: install Node before pnpm/action-setup runs.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: clients/tv-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' run build
      - run: pnpm run lint
      - run: pnpm run typecheck

  # Every stage 2 build waits on this one job. Android, Xbox, Harmony, webOS/Tizen and Roku run their own
  # unit tests inside their build jobs (they need the same toolchains), and those jobs gate the release.
  tests:
    name: Stage 1 fast tests passed
    needs: [prepare, test-backend, test-linux-phone, test-fire-tv, test-tv-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Fast tests passed for ${{ needs.prepare.outputs.version }}"

  # ---------------------------------------------------------------------------
  # Stage 2: signed, repeatable builds of every client.
  # ---------------------------------------------------------------------------

  server:
    name: Server
    needs: [prepare, tests]
    uses: ./.github/workflows/backend-release.yml
    # Its standalone `publish` job (skipped here) declares contents: write, and a caller must grant
    # every permission a called job declares, or the run fails to start.
    permissions:
      contents: write
      packages: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}

  regional:
    name: Regional image
    needs: [prepare, tests]
    uses: ./.github/workflows/regional-image.yml
    permissions:
      contents: read
      packages: write
    with:
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}

  android:
    name: Android APK
    needs: [prepare, tests]
    uses: ./.github/workflows/android-ci.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}

  tv:
    name: TV packages
    needs: [prepare, tests]
    uses: ./.github/workflows/tv-web-ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  xbox:
    name: Xbox
    needs: [prepare, tests]
    uses: ./.github/workflows/xbox-ci.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}

  harmony:
    name: HarmonyOS
    needs: [prepare, tests]
    uses: ./.github/workflows/harmony-ci.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}

  roku:
    name: Roku
    needs: [prepare, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/roku
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow (the channel's image validation imports it)
        run: python -m pip install --quiet pillow==11.3.0

      - name: Stamp the version and package the channel
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<<"$VERSION"
          sed -i -E "s/^major_version=.*/major_version=$major/; s/^minor_version=.*/minor_version=$minor/; s/^build_version=.*/build_version=$(printf '%05d' "$patch")/" manifest
          sed -i -E "s/(clientVersion: )\"[^\"]*\"/\1\"$VERSION\"/" source/Config.brs
          grep -E '^(major|minor|build)_version=' manifest
          make package PACKAGE="build/playarr-roku-$VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: playarr-roku-package
          path: clients/roku/build/playarr-roku-*.zip
          if-no-files-found: error

  linux:
    name: Linux phone
    needs: [prepare, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/linux-mobile
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK, libadwaita and GStreamer development packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Stamp the release version into the manifest and the crate's own lock entry (no network, deps stay locked).
          sed -i -E "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          sed -i -E "/^name = \"playarr-linux-mobile\"/{n;s/^version = \".*\"/version = \"$VERSION\"/}" Cargo.lock
          cargo build --release --locked
          mkdir -p "$RUNNER_TEMP/linux"
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner \
            -cf - -C target/release playarr-mobile -C ../../data . | gzip -n > "$RUNNER_TEMP/linux/playarr-linux-$VERSION-x86_64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: playarr-linux-package
          path: ${{ runner.temp }}/linux/*
          if-no-files-found: error

  macos:
    name: macOS
    needs: [prepare, tests]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the unsigned Release app (no Developer ID yet)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.apple_build }}
        run: |
          set -euo pipefail
          xcodebuild build -project clients/apple-tv/PlayarrTV.xcodeproj -scheme PlayarrMac -configuration Release \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" | tail -n 3
          app="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name PlayarrMac.app | head -n 1)"
          [[ -n "$app" ]] || { echo '::error::no Release PlayarrMac.app'; exit 1; }
          bad=0
          while IFS= read -r f; do
            for arg in -PlayarrAccessToken -PlayarrRefreshToken; do
              if strings -a "$f" | grep -q -- "$arg"; then echo "::error::found $arg in ${f#"$app"/}"; bad=1; fi
            done
          done < <(find "$app" -type f \( -perm -u+x -o -name '*.dylib' \))
          (( bad == 0 ))
          mkdir -p "$RUNNER_TEMP/macos"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/macos/playarr-macos-$VERSION-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: playarr-macos-package
          path: ${{ runner.temp }}/macos/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, server, regional, android, tv, roku, xbox, harmony, linux, macos]
    # The server and the Android APK are required; other platforms are optional.
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.server.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      url: ${{ steps.publish.outputs.url }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only the packages: docker/build-push-action also uploads a `.dockerbuild` build record.
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          pattern: playarr-*

      - name: Collect the release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          a=artefacts
          cp "$a/playarr-server-dist"/playarr-server-* "$a/playarr-server-dist/latest.json" assets/
          cp "$a/playarr-android-$VERSION/playarr-android.apk" "$a/playarr-android-$VERSION/playarr-android.json" assets/
          [[ -d "$a/playarr-tv-packages" ]] && cp "$a/playarr-tv-packages"/* assets/
          [[ -d "$a/playarr-roku-package" ]] && cp "$a/playarr-roku-package"/*.zip assets/
          [[ -d "$a/playarr-xbox-package" ]] && cp "$a/playarr-xbox-package"/* assets/
          [[ -d "$a/playarr-linux-package" ]] && cp "$a/playarr-linux-package"/* assets/
          [[ -d "$a/playarr-macos-package" ]] && cp "$a/playarr-macos-package"/* assets/
          if [[ -d "$a/playarr-harmony-package" ]]; then
            hap="$(find "$a/playarr-harmony-package" -name '*.hap' -print -quit)"
            [[ -n "$hap" ]] && cp "$hap" "assets/playarr-harmony-$VERSION-unsigned.hap"
          fi
          (cd assets && sha256sum -c "playarr-server-$VERSION-SHA256SUMS")
          (cd assets && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS)
          ls -l assets
          cat assets/SHA256SUMS

      - name: Write the release notes
        shell: bash
        env:
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          SERVER_DIGEST: ${{ needs.server.outputs.digest }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          node scripts/release-notes.mjs "$VERSION" $PREVIOUS_TAG > "assets/playarr-$VERSION-CHANGELOG.md"
          {
            echo "Playarr $VERSION for every platform, built from \`${GITHUB_SHA:0:8}\`."
            echo
            echo "| App | Where |"
            echo "|---|---|"
            echo "| Playarr Server | \`ghcr.io/$owner/playarr:$VERSION\` (\`${SERVER_DIGEST}\`), Linux tarballs below, https://playarr.app/clients/server |"
            echo "| Regional server image | \`ghcr.io/$owner/playarr:${GITHUB_SHA:0:8}\` |"
            echo "| Android | \`playarr-android.apk\` (sideload), Google Play closed testing |"
            echo "| iOS and tvOS | TestFlight |"
            echo "| LG webOS | \`playarr-webos-$VERSION.ipk\` |"
            echo "| Samsung Tizen | \`playarr-tizen-$VERSION-unsigned.zip\` (sign with your Samsung certificate profile) |"
            echo "| Roku | \`playarr-roku-$VERSION.zip\` (sideload) |"
            echo "| Xbox | \`playarr-xbox-$VERSION-x64-unsigned.appx\` (unsigned; sign before sideloading) |"
            echo "| HarmonyOS | \`playarr-harmony-$VERSION-unsigned.hap\` |"
            echo "| Linux phone | \`playarr-linux-$VERSION-x86_64.tar.gz\` |"
            echo "| macOS | \`playarr-macos-$VERSION-unsigned.zip\` (unsigned) |"
            echo
            echo "A platform whose package is missing below did not build for this release; see the run summary."
            echo "Verify downloads against \`SHA256SUMS\`."
            echo
          } > "$RUNNER_TEMP/notes.md"
          # GitHub caps a release body at 125,000 characters, so the body carries a short summary and the
          # full notes are attached as a file.
          node scripts/release-notes.mjs --summary "$VERSION" $PREVIOUS_TAG >> "$RUNNER_TEMP/notes.md"
          printf '\nThe full changelog for this release is attached as `playarr-%s-CHANGELOG.md`.\n' "$VERSION" >> "$RUNNER_TEMP/notes.md"
          wc -c "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub Release
        id: publish
        if: needs.prepare.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" assets/* --target "$GITHUB_SHA" --title "Playarr $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest
          echo "url=$(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_OUTPUT"

  play:
    name: Google Play closed testing
    needs: [prepare, release]
    if: always() && needs.release.result == 'success'
    uses: ./.github/workflows/android-play-internal.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}

  apple:
    name: TestFlight
    needs: [prepare, release]
    if: always() && needs.release.result == 'success'
    uses: ./.github/workflows/ios-release.yml
    secrets: inherit
    with:
      source_sha: ${{ github.sha }}
      marketing_version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.apple_build }}
      platform: both
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}

  # ---------------------------------------------------------------------------
  # Stage 3 (continued): stores with no account yet. Each logs "store pending" and succeeds. When a store
  # is wired, add its release-<store> environment, its credential secret and its upload step together.
  # Skipped in a dry run.
  # ---------------------------------------------------------------------------
  stores:
    name: Store ${{ matrix.name }}
    needs: [prepare, release]
    if: always() && needs.release.result == 'success' && needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Roku Channel Store, board: 59.10065 }
          - { name: Samsung Seller Office, board: 59.10066 }
          - { name: LG Seller Lounge, board: 59.10067 }
          - { name: Huawei AppGallery, board: 59.10070 }
          - { name: Microsoft Partner Center, board: 59.10069 }
          - { name: Amazon Appstore, board: 59.10061 }
    steps:
      - name: Report pending
        env:
          STORE_NAME: ${{ matrix.name }}
          BOARD: ${{ matrix.board }}
        run: |
          msg="$STORE_NAME: store pending: no account yet (board $BOARD)"
          echo "$msg"
          echo "- $msg" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Deploy playarr.app
    needs: [prepare, release]
    # Runs once the GitHub Release exists (playarr.app/downloads serves from it). Deploys the release
    # commit; the guard skips only when a newer commit is already live. A dry run builds and tests only.
    if: always() && needs.prepare.result == 'success' && needs.release.result == 'success'
    uses: ./.github/workflows/web-ci.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}

  summary:
    name: Summary
    needs: [prepare, tests, server, regional, android, tv, roku, xbox, harmony, linux, macos, release, play, apple, web, stores]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write the summary
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          RELEASE_URL: ${{ needs.release.outputs.url }}
          APPLE_BUILD: ${{ needs.prepare.outputs.apple_build }}
          ANDROID_CODE: ${{ needs.prepare.outputs.android_code }}
          WEB_DEPLOYED: ${{ needs.web.outputs.deployed }}
          WEB_SHA: ${{ needs.web.outputs.sha }}
          PLAY_CODE: ${{ needs.play.outputs.version_code || needs.prepare.outputs.play_code }}
          EXTERNAL_TESTFLIGHT: ${{ needs.apple.outputs.external_distribution }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          result() { jq -r --arg j "$1" '.[$j].result // "unknown"' <<<"$NEEDS"; }
          mark() { case "$1" in success) echo "✅ released" ;; skipped) echo "⏭️ skipped" ;; *) echo "❌ $1" ;; esac; }
          [[ "$DRY_RUN" == "true" ]] && dry=" (dry run: nothing published)" || dry=""
          {
            echo "## Playarr ${VERSION:-?} release$dry"
            echo
            echo "GitHub Release: ${RELEASE_URL:-not created}"
            echo
            echo "| Platform | Result | Where | Notes |"
            echo "|---|---|---|---|"
            echo "| Server | $(mark "$(result server)") | GitHub Release tarballs, \`ghcr.io/$owner/playarr:$VERSION\` | required |"
            echo "| Regional image | $(mark "$(result regional)") | \`ghcr.io/$owner/playarr:${GITHUB_SHA:0:8}\` | |"
            echo "| Android APK | $(mark "$(result android)") | GitHub Release, playarr.app/downloads/android | versionCode $ANDROID_CODE; required |"
            echo "| Google Play | $(mark "$(result play)") | closed testing (alpha) | versionCode $PLAY_CODE |"
            echo "| iOS and tvOS | $(mark "$(result apple)") | TestFlight | build $APPLE_BUILD |"
            echo "| webOS and Tizen | $(mark "$(result tv)") | GitHub Release | Tizen is unsigned (no Samsung certificate in CI) |"
            echo "| Roku | $(mark "$(result roku)") | GitHub Release | sideload zip |"
            echo "| Xbox | $(mark "$(result xbox)") | GitHub Release | unsigned .appx (no signing certificate) |"
            echo "| HarmonyOS | $(mark "$(result harmony)") | GitHub Release | unsigned HAP (no AppGallery signing material) |"
            echo "| Linux phone | $(mark "$(result linux)") | GitHub Release | binary tarball |"
            echo "| macOS | $(mark "$(result macos)") | GitHub Release | unsigned app zip (no Developer ID) |"
            echo "| Roku, Samsung, LG, Huawei, Microsoft, Amazon stores | $(mark "$(result stores)") | see the store job summaries | a store without an account logs \"store pending\"; skipped in a dry run |"
            echo "| playarr.app (web) | $(mark "$(result web)") | https://playarr.app | version $VERSION, commit ${WEB_SHA:0:8}, deployed: ${WEB_DEPLOYED:-n/a} (false: a newer commit was already live, or dry run) |"
            echo "| GitHub Release | $(mark "$(result release)") | ${RELEASE_URL:-} | |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${EXTERNAL_TESTFLIGHT:-}" ]]; then
            {
              echo
              echo "### External TestFlight groups$dry"
              echo
              echo "$EXTERNAL_TESTFLIGHT"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"
          # Fail the run if anything required or any store publish failed, so it is visible.
          for job in prepare tests server android release play apple web; do
            r="$(result "$job")"
            if [[ "$r" != success ]]; then echo "::error::$job: $r"; failed=1; fi
          done
          if [[ "$DRY_RUN" != "true" ]]; then
            r="$(result stores)"
            if [[ "$r" != success ]]; then echo "::error::stores: $r"; failed=1; fi
          fi
          exit "${failed:-0}"
