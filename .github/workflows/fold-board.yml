# Post-merge fold: this folds the tasks.d/ and changelog.d/ fragments that are pending after any
# push to main, as Thomas McFarlane with a `Board-Fold: yes` trailer, pushing with the
# TRAIN_DEPLOY_KEY deploy key when it exists (so CI and deploys fire natively) and GITHUB_TOKEN otherwise. main is not
# protected, so a direct push is allowed; Actions cannot open pull requests here. See scripts/fold-main.sh.
name: Fold board

on:
  push:
    branches: [main]
    paths: ['tasks.d/**', 'changelog.d/**']
  workflow_dispatch:

# Own group, no cancelling. A fold that races
# a landing just re-fetches and retries (scripts/fold-main.sh).
concurrency:
  group: fold-board
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fold:
    name: Fold pending fragments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.TRAIN_DEPLOY_KEY }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fold and push
        run: scripts/fold-main.sh
