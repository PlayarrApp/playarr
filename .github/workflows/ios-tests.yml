name: iOS tests

# Compiles the iOS app and runs its unit tests on a hosted macOS simulator whenever a pull
# request touches clients/ios, and builds and tests the macOS app (clients/apple-tv, PlayarrMac
# target: the tvOS sources plus PlayarrKit) whenever a pull request touches what it compiles.
# Each job runs only for its own paths. The tvOS leg and manual runs stay in simulator-tests.yml.
on:
  pull_request:
    paths:
      - clients/ios/**
      - clients/apple-tv/**
      - docs/parity/fonts/**
      - .github/workflows/ios-tests.yml
      - .github/scripts/apple-test-simulator/**

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed Apple clients
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'clients/ios/**'
              - '.github/workflows/ios-tests.yml'
              - '.github/scripts/apple-test-simulator/**'
            macos:
              - 'clients/apple-tv/**'
              - 'clients/ios/Package.swift'
              - 'clients/ios/Sources/PlayarrKit/**'
              - 'clients/ios/Sources/PlayarrApp/DesignFont.swift'
              - 'clients/ios/Resources/Fonts/**'
              - 'docs/parity/fonts/**'
              - '.github/workflows/ios-tests.yml'

  ios-tests:
    name: Test Playarr iOS on iPhone Simulator
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare the CocoaPods workspace
        shell: bash
        timeout-minutes: 20
        run: bash clients/ios/scripts/prepare.sh

      - name: Create an isolated test simulator
        id: simulator
        shell: bash
        timeout-minutes: 5
        env:
          INPUT_DESTINATION: platform=iOS Simulator,name=iPhone 17
        run: node .github/scripts/apple-test-simulator/main.js

      - name: Run the Xcode tests
        id: ios-tests
        shell: bash
        working-directory: clients/ios
        timeout-minutes: 45
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_RUNNER_PLAYARR_UI_TEST_SERVER_URL: ${{ secrets.PLAYARR_DEVICE_TEST_SERVER_URL }}
          TEST_RUNNER_PLAYARR_UI_TEST_USERNAME: ${{ secrets.PLAYARR_DEVICE_TEST_USERNAME }}
          TEST_RUNNER_PLAYARR_UI_TEST_PASSWORD: ${{ secrets.PLAYARR_DEVICE_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$SIMULATOR_UDID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          xcodebuild test -scheme PlayarrApp -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/ios.xcresult" \
            -workspace "$GITHUB_WORKSPACE/clients/ios/Playarr.xcworkspace" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" 2>&1 | tee "$RUNNER_TEMP/ios-log.txt"
          test_case="Test Case '-[PlayarrAppUITests.DetailNavigationUITests testHomeAndSearchSeriesDetailsSelectSeriesAndRestoreTheirOrigin]' passed"
          if ! grep -Fq "$test_case" "$RUNNER_TEMP/ios-log.txt"; then
            echo "Expected iPhone navigation UI test did not execute and pass: $test_case" >&2
            exit 1
          fi
          grep -F "$test_case" "$RUNNER_TEMP/ios-log.txt"

      - name: Export failure diagnostics
        if: ${{ always() && steps.ios-tests.outcome != 'success' }}
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -uo pipefail
          diagnostics="$RUNNER_TEMP/ios-diagnostics"
          mkdir -p "$diagnostics/attachments"
          if [[ -d "$RUNNER_TEMP/ios.xcresult" ]]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/ios.xcresult" --format json > "$diagnostics/test-summary.json" 2>&1 || true
            xcrun xcresulttool export diagnostics --path "$RUNNER_TEMP/ios.xcresult" --output-path "$diagnostics/xcresult" > "$diagnostics/xcresult-export.txt" 2>&1 || true
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ios.xcresult" --output-path "$diagnostics/attachments" > "$diagnostics/attachments-export.txt" 2>&1 || true
          fi
          if [[ -f "$RUNNER_TEMP/ios-log.txt" ]]; then
            cp "$RUNNER_TEMP/ios-log.txt" "$diagnostics/xcodebuild.log"
          fi
          if [[ -n "$SIMULATOR_UDID" ]]; then
            xcrun simctl list devices --json > "$diagnostics/simulator-devices.json" 2>&1 || true
            xcrun simctl spawn "$SIMULATOR_UDID" log show --last 10m --style compact --predicate 'process == "SpringBoard" OR process == "Playarr" OR process == "Runner" OR process == "xctest"' > "$diagnostics/simulator.log" 2>&1 || true
          fi

      - name: Upload failure diagnostics
        if: ${{ always() && steps.ios-tests.outcome != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-diagnostics-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete the test simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        shell: bash
        timeout-minutes: 5
        env:
          STATE_simulator_udid: ${{ steps.simulator.outputs.udid }}
        run: node .github/scripts/apple-test-simulator/cleanup.js

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-log-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-log.txt
          if-no-files-found: ignore
          retention-days: 7

  macos-tests:
    name: Build and test Playarr for Mac
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record the toolchain
        shell: bash
        run: xcodebuild -version

      - name: Build the macOS app and run its unit tests
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          xcodebuild test -project clients/apple-tv/PlayarrTV.xcodeproj -scheme PlayarrMac -configuration Debug \
            -destination 'platform=macOS' -resultBundlePath "$RUNNER_TEMP/macos.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/macos-log.txt"

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-log-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-log.txt
          if-no-files-found: ignore
          retention-days: 7
