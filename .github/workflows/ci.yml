# ======================================================================
# Playarr Server CI
# ======================================================================
#
# Single CI workflow for pull requests and pushes to `main`. A `changes` job
# runs dorny/paths-filter once and every platform-specific check job is
# gated on its boolean output, so a PR that only touches a client
# doesn't pay for a Rust/Android/tv-web build.
#
# BRANCH PROTECTION -- READ THIS BEFORE CONFIGURING REQUIRED STATUS CHECKS:
#   Only the terminal `ci-required` job should ever be added as a "required
#   status check" in this repo's branch protection settings. Do NOT mark
#   `backend-check`, `android-check`, `ios-check`, `xbox-check`,
#   `tv-web-check`, or `openapi-contract-check` as required themselves.
#
#   Those jobs are conditional (`if: needs.changes.outputs.<platform> ==
#   'true'`). When a job is skipped by its own `if:`, GitHub reports its
#   status as "skipped", not "success" -- and a required check that a PR's
#   file set can cause to never run at all is a well-known way to
#   permanently block merges (the check just sits pending forever). GitHub
#   pages team maintains the recommended pattern is a single always-run
#   aggregator job, which is what `ci-required` is here: it `needs` every
#   other job, runs unconditionally (`if: always()`), and explicitly maps
#   skipped -> pass while failure/cancelled -> fail. That makes it the only
#   job that is guaranteed to always report a final pass/fail for any PR,
#   regardless of which paths changed, so it's the only one safe to require.
# ======================================================================

name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # Board-only pushes (the post-merge fold commit) start no CI: they would otherwise replace the pending run of the real
    # merge commit in the single main concurrency group, so that commit would never be tested or deployed. A push that
    # also touches any other file still runs.
    paths-ignore:
      - 'TASKS.md'
      - 'CHANGELOG.md'
      - 'tasks.d/**'
      - 'changelog.d/**'
  # Manual runs; a dispatch on main runs everything.
  workflow_dispatch:

concurrency:
  # PRs share one group per PR number and are cancelled by newer pushes. Pushes to main share ONE group, with
  # cancel-in-progress off: GitHub then lets a running main run finish and keeps only the NEWEST pending one, so the
  # latest main is always tested and deployed. Per-SHA groups (the earlier setup) let every merge queue its own full
  # run: on 11 Oct 2026 the queue held 30+ stale main runs (about 60 cancelled by hand), starving PR runs. A skipped intermediate commit is covered by the next run, which tests a tree
  # containing it. Manual runs keep their own per-SHA group so a push never supersedes them.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Detect which platform(s) a PR/push touches, so downstream jobs can
  # skip themselves when irrelevant. Owner rule: selection follows the dependency graph (Rust crates,
  # Android modules and tv-web packages plus their dependents); a shared input (this workflow, a
  # scope script, a root manifest or toolchain file) selects everything; `ci-required` always reports. Directory names below reflect the
  # monorepo layout as defined by the in-flight scaffolding tasks for each
  # component -- update these globs here if a component's directory layout
  # changes.
  # ---------------------------------------------------------------------
  changes:
    name: Detect changed platforms
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.scope.outputs.rust_scope != 'none' }}
      rust_scope: ${{ steps.scope.outputs.rust_scope }}
      openapi: ${{ steps.scope.outputs.openapi }}
      android: ${{ steps.android.outputs.android }}
      android_tasks: ${{ steps.android.outputs.android_tasks }}
      xbox: ${{ steps.all.outputs.full == 'true' || steps.filter.outputs.xbox == 'true' }}
      tizen-native: ${{ steps.all.outputs.full == 'true' || steps.filter.outputs.tizen-native == 'true' }}
      harmony: ${{ steps.all.outputs.full == 'true' || steps.filter.outputs.harmony == 'true' }}
      linux-mobile: ${{ steps.all.outputs.full == 'true' || steps.filter.outputs.linux-mobile == 'true' }}
      tv-web: ${{ steps.all.outputs.full == 'true' || steps.filter.outputs.tv-web == 'true' }}
      firetv: ${{ steps.all.outputs.full == 'true' || steps.filter.outputs.firetv == 'true' }}
      tv_web_filters: ${{ steps.tvweb.outputs.tv_web_filters }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Affected-only Rust selection (changed crates plus dependents; shared
      # inputs and every non-PR event select the full workspace).
      # CHANGELOG.md and TASKS.md are conflict hotspots: PRs add fragment files instead.
      - name: Reject direct CHANGELOG.md / TASKS.md edits
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/ci/check-fragments.sh

      - name: Require GitHub-hosted runner labels
        run: scripts/ci/check-hosted-runners.sh

      - name: Require cleartext HTTP to user-entered servers
        run: scripts/ci/check-cleartext-policy.sh

      - name: Keep iOS debug-only parity symbols out of Release code
        run: scripts/ci/check-ios-debug-parity.sh

      # Owner rule: public screenshots come from scripts/showcase (open-movie demo library), not the parity fixture.
      - name: Require showcase-made public screenshots
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: scripts/ci/check-public-screenshots.sh

      - name: Public screenshot guard tests
        run: scripts/ci/test-check-public-screenshots.sh

      # Owner rule: no Co-authored-by trailers on any commit of a PR.
      - name: Reject Co-authored-by trailers
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/ci/check-no-coauthor.sh

      # Owner rule (docs/design/page-layout.md, section 7.4): the look of the shared page layout changes only on an
      # explicit owner request that names the reference, recorded as a Layout-Change line in the PR body. Branch
      # dispatches read the body through the API.
      - name: Require an owner request for shared layout look changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/check-layout-owner-request.sh

      - name: Layout owner-request gate tests
        run: scripts/ci/test-layout-owner-request.sh

      # The repository is public: no hostnames, addresses, paths or pins of a
      # real deployment. Site-specific names come from a secret, never the tree.
      - name: Reject environment-specific data
        env:
          ENV_DATA_DENYLIST: ${{ secrets.ENV_DATA_DENYLIST }}
        run: scripts/ci/check-env-data.sh

      - name: Post-merge fold tests
        run: scripts/ci/test-fold-main.sh

      - name: Android main APK version tests
        run: scripts/ci/test-android-main-version.sh

      - name: Release notes script tests
        run: node --test scripts/release-notes.test.mjs scripts/release/build-clients-json.test.mjs scripts/fold-fragments.test.mjs scripts/board-sync.test.mjs

      - name: Profile avatar presets match the web reference
        run: node clients/shared/profile-avatars/render.mjs --check

      # Dispatches on main validate everything.
      - name: Full run?
        id: all
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" = main ]; then
            echo full=true >> "$GITHUB_OUTPUT"
          fi

      - name: Select affected Rust crates
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: scripts/ci/rust-scope.sh | tee -a "$GITHUB_OUTPUT"

      # Affected-only Android selection with the same diff logic as the Rust scope (so dispatched
      # branch runs select correctly too). Full `build` on main dispatches only; pushes diff against the previous main tip.
      - name: Select affected Android work
        id: android
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: scripts/ci/android-scope.sh | tee -a "$GITHUB_OUTPUT"

      # Affected-only tv-web lint and typecheck: changed workspace packages plus their
      # dependents on a pull request; empty means everything (scripts/ci/tv-web-scope.sh).
      # Full on main dispatches like the other scopes.
      - name: Select affected tv-web packages
        id: tvweb
        env:
          EVENT_NAME: ${{ steps.all.outputs.full == 'true' && 'full' || github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: scripts/ci/tv-web-scope.sh | tee -a "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tizen-native:
              - 'clients/tizen-native/**'
              - 'clients/xbox/src/Playarr.Core/**'
              - '.github/workflows/ci.yml'
            xbox:
              - 'clients/xbox/**'
              - '.github/workflows/xbox-ci.yml'
              - '.github/workflows/ci.yml'
            harmony:
              - 'clients/harmony/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/harmony-ci.yml'
            linux-mobile:
              - 'clients/linux-mobile/**'
              # The client embeds the shared avatar plates.
              - 'clients/shared/profile-avatars/**'
              - '.github/workflows/ci.yml'
            tv-web:
              - 'clients/tv-web/**'
              # web/src/components/shell/headerButtonParity.test.ts reads the Apple clients' Swift sources.
              - 'clients/apple-tv/**'
              - 'clients/ios/**'
              - '.github/workflows/ci.yml'
            # The Fire TV app builds against the shared tv-web packages, the shared translations and the web
            # stylesheet its token test reads, so a change to any of them can break its tests.
            firetv:
              - 'clients/fire-tv/**'
              - 'clients/tv-web/packages/**'
              - 'clients/tv-web/web/src/lib/i18n/**'
              - 'clients/tv-web/web/src/styles/global.css'
              - 'docs/parity/fonts/**'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------
  # Backend (Rust workspace under backend/)
  # ---------------------------------------------------------------------
  backend-check:
    name: Backend checks (fmt, clippy, test, deny)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    env:
      # No debuginfo for dev/test builds: shorter compile + link and a much
      # smaller rust-cache archive to save/restore.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          # Only main pushes write the cache; PRs restore
          # main's. PR-scoped 1 GB saves evicted main's entries from the 10 GB repository quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Persist the partial target dir even when clippy/test fails so the
          # re-run after a fix does not start cold.
          cache-on-failure: true
          # ort-sys downloads the ONNX Runtime static library into this
          # directory at build-script time. The cached target dir records its
          # path, so a restored cache without it fails to link ("could not find
          # native static library `onnxruntime`"). Cache them together; the new
          # prefix discards earlier target caches that lack it.
          cache-directories: ~/.cache/ort.pyke.io
          prefix-key: v1-rust

      - name: cargo fmt -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (warnings denied)
        env:
          SCOPE: ${{ needs.changes.outputs.rust_scope }}
        run: |
          if [ "$SCOPE" = full ]; then pkgs=--workspace; else pkgs="$SCOPE"; fi
          cargo clippy $pkgs --all-targets --all-features -- -D warnings

      - name: Install cargo-nextest and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      # nextest runs every test in its own process across all cores (the old `cargo test` ran
      # the 5-minute playarr-api binary one binary at a time). Doctests are not supported by
      # nextest; none exist today, so they run on full runs only.
      - name: cargo nextest
        env:
          SCOPE: ${{ needs.changes.outputs.rust_scope }}
        run: |
          if [ "$SCOPE" = full ]; then pkgs=--workspace; else pkgs="$SCOPE"; fi
          cargo nextest run $pkgs --all-features --no-fail-fast

      - name: cargo test --doc
        if: needs.changes.outputs.rust_scope == 'full'
        run: cargo test --workspace --all-features --doc

      - name: cargo deny check
        run: cargo deny check

  # ---------------------------------------------------------------------
  # Android (one project and one universal application)
  # ---------------------------------------------------------------------
  android-check:
    name: Android build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      # Ephemeral runners start empty. Main (every push, the nightly and main dispatches run the
      # full build) writes the Gradle home and build cache; PRs only read it, so a PR recompiles
      # just what it changed instead of evicting main's entries from the 10 GB repository quota.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Persists the (encrypted) configuration cache. Without the secret (not yet created, or a
          # fork PR) the input is empty and setup-gradle simply skips the configuration cache entry;
          # the build still runs, only without that warm start.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # `build` on main/nightly; on PRs only the affected modules plus the sideload debug app
      # (scripts/ci/android-scope.sh). Build cache and configuration cache are on in gradle.properties.
      - name: Gradle ${{ needs.changes.outputs.android_tasks == 'build' && 'build (all modules)' || 'affected modules' }}
        working-directory: clients/android
        env:
          TASKS: ${{ needs.changes.outputs.android_tasks }}
        run: ./gradlew $TASKS

  # ---------------------------------------------------------------------
  # Signed Android (TV and phone) APK from main, for testers. Full build on main only (never on
  # pull requests, which cannot read the signing secrets and are covered by android-check above).
  # It uses the release signing key of the `release-android` environment, which accepts main and
  # the android-v* tags, and uploads the APK as a workflow artefact. Nothing is published to Play
  # or to a GitHub Release. versionName is <version>-main.<commits>; versionCode rises with every
  # commit and is above every release, so it installs over a release without uninstalling
  # (scripts/ci/android-main-version.sh).
  # ---------------------------------------------------------------------
  android-apk:
    name: Android signed APK (main)
    needs: changes
    if: needs.changes.outputs.android == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: release-android
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit count is the versionCode suffix.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          latest_code=0
          if manifest="$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/playarr-android.json")"; then
            latest_code="$(jq -r '.version_code // 0' <<< "$manifest")"
          else
            echo "::warning::Could not read the latest release manifest; not comparing against it"
          fi
          scripts/ci/android-main-version.sh clients/android/version.properties "$(git rev-list --count HEAD)" "$latest_code" | tee -a "$GITHUB_OUTPUT"
          echo "keystore_path=${{ runner.temp }}/playarr-android-release.jks" >> "$GITHUB_OUTPUT"

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ steps.version.outputs.keystore_path }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Android release-signing secrets are not configured" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Build signed APK
        working-directory: clients/android
        env:
          PLAYARR_VERSION_NAME: ${{ steps.version.outputs.name }}
          PLAYARR_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_PATH: ${{ steps.version.outputs.keystore_path }}
        run: ./gradlew :app:assembleSideloadRelease

      - name: Verify and package APK
        shell: bash
        env:
          EXPECTED_ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          apk="$(find clients/android/app/build/outputs/apk/sideload/release -name '*.apk' -type f -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "Signed APK output is missing" >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          scripts/verify-android-release-apk.sh "$apk" "$apksigner" "$aapt" "$EXPECTED_ANDROID_SIGNING_CERT_SHA256" \
            "io.playarr.mobile" "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}"
          mkdir -p release
          cp "$apk" release/playarr-android.apk
          (cd release && sha256sum playarr-android.apk > SHA256SUMS)
          printf '{"version_name":"%s","version_code":%s,"commit":"%s"}\n' \
            "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}" "$GITHUB_SHA" > release/playarr-android-main.json

      - name: Remove signing key
        if: always()
        run: rm -f "${{ steps.version.outputs.keystore_path }}"

      - name: Upload APK artefact
        uses: actions/upload-artifact@v4
        with:
          name: playarr-android-main-${{ steps.version.outputs.name }}
          path: release/
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # iOS and tvOS validation runs on macos-latest through the manual
  # simulator-tests.yml workflow, and signed TestFlight releases through
  # ios-release.yml. They are manual/tag gates, not automatic PR/main checks.
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Xbox (clients/xbox -- .NET solution). Only src/Playarr.Core (the
  # portable, netstandard2.0 client core) is checked here: it's buildable
  # with the `dotnet` CLI alone, matching the Justfile's xbox-core-build/
  # xbox-core-test recipes. The UWP application head
  # (src/Playarr.Xbox, TargetPlatformIdentifier=UAP) needs MSBuild, the
  # Windows 10 SDK, and Visual Studio's UWP workload -- it cannot be built
  # with `dotnet` on any OS, so it has no PR-time gate here; see
  # xbox-ci.yml's build-and-package job for that gap.
  # ---------------------------------------------------------------------
  xbox-check:
    name: Xbox core build & test
    needs: changes
    if: needs.changes.outputs.xbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/xbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('clients/xbox/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: dotnet build (Playarr.Core)
        run: dotnet build src/Playarr.Core/Playarr.Core.csproj

      - name: dotnet test (Playarr.Core.Tests)
        run: dotnet test tests/Playarr.Core.Tests/Playarr.Core.Tests.csproj

  # ---------------------------------------------------------------------
  # Samsung Tizen native client (clients/tizen-native, Tizen .NET / NUI).
  # Hosted ubuntu job: installs the Samsung Tizen workload from a pinned
  # Samsung/Tizen.NET script (checksum verified), builds the test-signed tpk
  # and runs the logic unit tests. No emulator here.
  # ---------------------------------------------------------------------
  tizen-native-check:
    name: Tizen native build & test
    needs: changes
    if: needs.changes.outputs.tizen-native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/tizen-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8.0.426 (released 14 Oct) fails to create .NET's named NuGet-Migrations mutex on the runners (IOException before any test runs); 8.0.425 is fine
          dotnet-version: '8.0.425'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-tizen-${{ runner.os }}-${{ hashFiles('clients/tizen-native/**/*.csproj') }}
          restore-keys: nuget-tizen-${{ runner.os }}-

      - name: Install the Samsung Tizen workload (pinned)
        run: |
          curl -fsSL https://raw.githubusercontent.com/Samsung/Tizen.NET/6ab8cb41e7ccab90a3ba838e7f6d6b38a9c4ec08/workload/scripts/workload-install.sh -o "$RUNNER_TEMP/wi.sh"
          echo "b6a8bbd3aefbcca452e05abce8272c82362c83da2cfaca2470cbb7fd07ac5158  $RUNNER_TEMP/wi.sh" | sha256sum -c -
          dotnet --version
          for attempt in 1 2 3; do
            sudo bash "$RUNNER_TEMP/wi.sh" -v 10.0.126 -t 8.0.400 --dotnet-install-dir "$(dirname "$(readlink -f "$(command -v dotnet)")")" && break
            [ "$attempt" = 3 ] && exit 1
            echo "workload install failed (attempt $attempt), retrying"; sleep $((attempt * 15))
          done

      - name: dotnet test (Playarr.Tizen.Logic.Tests)
        run: dotnet test tests/Playarr.Tizen.Logic.Tests/Playarr.Tizen.Logic.Tests.csproj

      - name: Build debug hooks (compile validation only)
        run: dotnet build src/Playarr.Tizen/Playarr.Tizen.csproj -c Debug -p:PlayarrDebug=true

      - name: Build the test-signed tpk
        run: dotnet build src/Playarr.Tizen/Playarr.Tizen.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: playarr-tizen-native-tpk
          path: clients/tizen-native/src/Playarr.Tizen/bin/Release/net8.0-tizen10.0/*.tpk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Xbox UWP head (Windows): the PR-time Windows build. Builds the unsigned
  # x64 sideload package exactly as xbox-ci.yml does (minus the release
  # environment) and uploads it with its framework dependencies, so a PR
  # build can be sideloaded on a Windows desktop for parity checks.
  # ---------------------------------------------------------------------
  xbox-uwp-package:
    name: Xbox UWP package (Windows)
    needs: changes
    if: needs.changes.outputs.xbox == 'true'
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build the unsigned x64 package
        shell: pwsh
        run: |
          msbuild clients/xbox/src/Playarr.Xbox/Playarr.Xbox.csproj /restore /m `
            /p:Configuration=Release /p:Platform=x64 `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false `
            "/p:AppxPackageDir=$env:RUNNER_TEMP\AppPackages\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $all = Get-ChildItem "$env:RUNNER_TEMP\AppPackages" -Recurse -Include *.msix, *.appx
          $package = $all | Where-Object { $_.FullName -notmatch '\\Dependencies\\' } | Select-Object -First 1
          if (-not $package) { throw 'msbuild produced no MSIX/APPX package' }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\xbox" | Out-Null
          Copy-Item $package.FullName "$env:RUNNER_TEMP\xbox\playarr-xbox-x64-unsigned$($package.Extension)"
          $all | Where-Object { $_.FullName -match '\\Dependencies\\x64\\' } | ForEach-Object {
            Copy-Item $_.FullName "$env:RUNNER_TEMP\xbox\dependency-$($_.Name)"
          }
          Get-ChildItem "$env:RUNNER_TEMP\xbox"

      - uses: actions/upload-artifact@v4
        with:
          name: playarr-xbox-pr-package
          path: ${{ runner.temp }}/xbox/*
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # HarmonyOS (clients/harmony -- native ArkTS/ArkUI HarmonyOS NEXT client).
  # Two jobs. `harmony-check` runs the two offline tiers in seconds: structural/contract validation (Tier 0,
  # scripts/validate.mjs) and the pure-logic core's unit tests (Tier 0b, tools/run-core-tests.mjs), matching the
  # Justfile's harmony-validate / harmony-test recipes. `harmony-hap` (below) is Tier 1: it fetches the public
  # OpenHarmony SDK and Command Line Tools (no Huawei login) and compiles a real, unsigned HAP, so an ArkTS type
  # error fails the PR. Signing and on-device behaviour still need real material and hardware.
  # ---------------------------------------------------------------------
  harmony-check:
    name: HarmonyOS client checks (validate, core tests)
    needs: changes
    if: needs.changes.outputs.harmony == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/harmony
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: clients/harmony/tools/package-lock.json

      - name: Install validation tooling
        run: npm ci --prefix tools

      - name: Validate project structure and contracts
        run: node scripts/validate.mjs

      - name: Run core logic tests
        run: node tools/run-core-tests.mjs

  # ArkTS compile. Same steps as the release workflow (harmony-ci.yml), which proved them on a dispatch; the SDK
  # (about 4.5 GB) is cached, so a warm run is a few minutes and a cold one about six.
  harmony-hap:
    name: HarmonyOS HAP compile (OpenHarmony SDK)
    needs: changes
    if: needs.changes.outputs.harmony == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/harmony
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache OpenHarmony SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/ohos-sdk
          key: ohos-sdk-6.1-release-cli-5.1.0.840

      # The SDK's resource compiler (restool) loads libGL at start-up; the runner image has none.
      - name: Install the OpenGL runtime library for the SDK toolchain
        run: |
          if ! ldconfig -p | grep -q 'libGL\.so\.1'; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y --no-install-recommends libgl1
          fi

      - name: Fetch the OpenHarmony SDK + Command Line Tools
        run: bash scripts/fetch-sdk.sh

      - name: Compile the HAP (release, unsigned)
        run: bash scripts/build.sh release

  # ---------------------------------------------------------------------
  # Linux phone client (clients/linux-mobile -- GTK4 + libadwaita, Rust). Builds against the runner's
  # distro GTK/libadwaita/GStreamer dev packages, then format, lint and unit tests. No display needed.
  # ---------------------------------------------------------------------
  linux-mobile-check:
    name: Linux phone client (fmt, clippy, tests)
    needs: changes
    if: needs.changes.outputs.linux-mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/linux-mobile
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK, libadwaita and GStreamer development packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/linux-mobile

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

  # ---------------------------------------------------------------------
  # tv-web (pnpm workspace under clients/tv-web -- packages/*, apps/*, web/)
  # ---------------------------------------------------------------------
  tv-web-check:
    name: tv-web lint & typecheck
    needs: changes
    if: needs.changes.outputs.tv-web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/tv-web
    steps:
      - uses: actions/checkout@v4

      # pnpm 11 needs Node >= 22.13: install Node before pnpm/action-setup runs (same toolchain as tv-web-ci.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: clients/tv-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web workspace dependencies
        run: pnpm --filter './packages/**' run build

      # Without a selection these delegate to the workspace root's own scripts
      # (clients/tv-web/package.json: "lint": "pnpm -r --if-present run lint",
      # "typecheck": "pnpm -r run typecheck"), a recursive run across every
      # package under packages/*, apps/*, web/ and admin/. On a pull request that only
      # touches workspace packages, the same scripts run for the changed packages and
      # their dependents (shared packages were built above either way).
      - name: Lint (recursive)
        env:
          FILTERS: ${{ needs.changes.outputs.tv_web_filters }}
        run: |
          if [ -z "$FILTERS" ]; then pnpm run lint; exit; fi
          args=(); for f in $FILTERS; do args+=(--filter "$f"); done
          pnpm -r "${args[@]}" --if-present run lint

      - name: Typecheck (recursive)
        env:
          FILTERS: ${{ needs.changes.outputs.tv_web_filters }}
        run: |
          if [ -z "$FILTERS" ]; then pnpm run typecheck; exit; fi
          args=(); for f in $FILTERS; do args+=(--filter "$f"); done
          pnpm -r "${args[@]}" run typecheck

      # Unit tests for the same affected set (packages that define a `test` script
      # are selected with their dependents, exactly like lint and typecheck). The web
      # package's own `lint` script runs the layout guards (`src/lib/*Audit.test.ts`,
      # `*Registry.test.ts` and `pageLayoutCss.test.ts`); this step runs its whole vitest
      # suite too, so the guards gate every PR that touches clients/tv-web before merge,
      # not only the post-merge deploy workflow.
      - name: Test (vitest)
        env:
          FILTERS: ${{ needs.changes.outputs.tv_web_filters }}
        run: |
          if [ -z "$FILTERS" ]; then pnpm -r --if-present run test; exit; fi
          args=(); for f in $FILTERS; do args+=(--filter "$f"); done
          pnpm -r "${args[@]}" --if-present run test

      # The exact command the post-merge deploy (web-ci.yml) runs, unconditionally, so a web test
      # failure there (for example an unbuilt workspace package) is caught before merge.
      # An unfiltered run already ran the whole web suite in "Test (vitest)" above, so it is skipped then.
      - name: Test web client (deploy parity)
        if: needs.changes.outputs.tv_web_filters != ''
        run: pnpm --filter @playarr-tv/web run test

  # ---------------------------------------------------------------------
  # OpenAPI contract: regenerate the utoipa-derived spec and diff it
  # against the committed copy. Delegates to scripts/openapi-diff-check.sh
  # (owned by the dev-scripts scaffolding) so the regeneration/diff logic
  # has exactly one implementation, used identically by CI and by
  # contributors running it locally.
  # ---------------------------------------------------------------------
  openapi-contract-check:
    name: OpenAPI contract diff
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Regenerate backend/openapi/playarr.yaml and diff
        run: |
          if [ ! -x scripts/openapi-diff-check.sh ] && [ ! -f scripts/openapi-diff-check.sh ]; then
            echo "::error::scripts/openapi-diff-check.sh not found. This script is expected to regenerate the utoipa-derived OpenAPI spec and diff it against the committed backend/openapi/playarr.yaml, exiting non-zero on drift."
            exit 1
          fi
          bash scripts/openapi-diff-check.sh

  # ---------------------------------------------------------------------
  # Fire TV (npm project under clients/fire-tv, React Native for Vega OS). Typecheck and jest only: the
  # .vpkg build needs Amazon's Vega SDK and a device, so it stays a local step. Runs only when the app, the
  # shared packages it imports, or this file change (the `changes` job above).
  # ---------------------------------------------------------------------
  firetv-check:
    name: Fire TV typecheck & jest
    needs: changes
    if: needs.changes.outputs.firetv == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/fire-tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: clients/fire-tv/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Jest
        run: npm test -- --ci

  # ---------------------------------------------------------------------
  # Storybook (clients/tv-web/web/.storybook): the public component catalogue deployed at /storybook. Typechecks the stories and builds it. The render smoke (browser) is a local script (docs/testing/local-device-tests.md).
  # ---------------------------------------------------------------------
  web-storybook:
    name: web storybook
    needs: changes
    if: needs.changes.outputs.tv-web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # pnpm 11 needs Node >= 22.13: install Node before pnpm/action-setup runs (same toolchain as tv-web-ci.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: clients/tv-web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: clients/tv-web
        run: pnpm install --frozen-lockfile

      - name: Build web workspace dependencies
        working-directory: clients/tv-web
        run: pnpm --filter './packages/**' run build

      - name: Typecheck the stories
        working-directory: clients/tv-web/web
        run: pnpm run typecheck:storybook

      - name: Build Storybook
        working-directory: clients/tv-web/web
        run: pnpm run build:storybook

  # ---------------------------------------------------------------------
  # Terminal aggregator -- see the file header comment for why this is the
  # only job that should be a required status check.
  # ---------------------------------------------------------------------
  ci-required:
    name: ci-required
    needs:
      - changes
      - backend-check
      - android-check
      - android-apk
      - xbox-check
      - tizen-native-check
      - xbox-uwp-package
      - harmony-check
      - harmony-hap
      - linux-mobile-check
      - tv-web-check
      - firetv-check
      - web-storybook
      - openapi-contract-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify no required job failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq .

          fail=0
          for job in changes backend-check android-check android-apk xbox-check tizen-native-check xbox-uwp-package harmony-check harmony-hap linux-mobile-check tv-web-check firetv-check web-storybook openapi-contract-check; do
            result=$(echo "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result // "missing"')
            echo "Job '$job' result: $result"
            case "$result" in
              failure|cancelled)
                fail=1
                ;;
              success|skipped)
                ;;
              *)
                echo "::warning::Unexpected result '$result' for job '$job'"
                fail=1
                ;;
            esac
          done

          if [ "$fail" -eq 1 ]; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi

          echo "All required jobs passed or were skipped (not applicable to this change)."
