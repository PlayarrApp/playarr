name: iOS page header capture

# Renders the page headers (iPad detail, Library and playlist; iPhone film detail and Settings section) and uploads the screenshots.

on:
  pull_request:
    paths:
      - clients/ios/**
      - .github/workflows/ios-page-header.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-page-header-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  capture:
    name: Page header capture (${{ matrix.device }})
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare the CocoaPods workspace
        run: bash clients/ios/scripts/prepare.sh

      - name: Pick the simulator device
        id: pick
        env:
          KIND: ${{ matrix.device }}
        run: |
          xcrun simctl list devicetypes
          xcrun simctl list runtimes
          # Query the installed iOS device types: an iPhone with a Dynamic Island, or the largest iPad.
          name=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, os, sys
          names = [d["name"] for d in json.load(sys.stdin)["devicetypes"] if d["identifier"].startswith("com.apple.CoreSimulator.SimDeviceType.")]
          if os.environ["KIND"] == "iphone":
              pick = [n for n in names if n == "iPhone 17"] or [n for n in names if n.startswith("iPhone 17") and "e" != n[-1]]
          else:
              pick = [n for n in names if n.startswith("iPad Air 13-inch")] or [n for n in names if n.startswith("iPad") and "GB" not in n]
          print(sorted(pick)[-1])
          ')
          echo "Using $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create an isolated test simulator
        id: simulator
        env:
          INPUT_DESTINATION: platform=iOS Simulator,name=${{ steps.pick.outputs.name }}
        run: node .github/scripts/apple-test-simulator/main.js

      - name: Render the screens
        id: render
        working-directory: clients/ios
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_RUNNER_PLAYARR_PAGE_HEADER_CAPTURE: "1"
          TEST_RUNNER_PLAYARR_UI_TEST_SERVER_URL: ${{ secrets.PLAYARR_DEVICE_TEST_SERVER_URL }}
          TEST_RUNNER_PLAYARR_UI_TEST_USERNAME: ${{ secrets.PLAYARR_DEVICE_TEST_USERNAME }}
          TEST_RUNNER_PLAYARR_UI_TEST_PASSWORD: ${{ secrets.PLAYARR_DEVICE_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$SIMULATOR_UDID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          DERIVED_DATA="$RUNNER_TEMP/page-header-derived"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b 2>&1 | tee "$RUNNER_TEMP/page-header-boot-log.txt"
          xcodebuild build-for-testing -scheme PlayarrApp -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            -workspace "$GITHUB_WORKSPACE/clients/ios/Playarr.xcworkspace" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" 2>&1 | tee "$RUNNER_TEMP/page-header-build-log.txt"
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Playarr.app"
          [[ -d "$APP_PATH" ]]
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")
          [[ -n "$BUNDLE_ID" ]]
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH" 2>&1 | tee "$RUNNER_TEMP/page-header-install-log.txt"
          INSTALLED_APP=$(xcrun simctl get_app_container "$SIMULATOR_UDID" "$BUNDLE_ID" app)
          [[ -d "$INSTALLED_APP" ]]
          printf 'Installed app bundle %s at %s\n' "$BUNDLE_ID" "$INSTALLED_APP" | tee "$RUNNER_TEMP/page-header-install-check.txt"
          xcodebuild test-without-building -scheme PlayarrApp -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:PlayarrAppUITests/PageHeaderCaptureUITests \
            -resultBundlePath "$RUNNER_TEMP/page-header.xcresult" \
            -workspace "$GITHUB_WORKSPACE/clients/ios/Playarr.xcworkspace" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" 2>&1 | tee "$RUNNER_TEMP/page-header-log.txt"
          grep -Fq "PageHeaderCaptureUITests testHeaders]' passed" "$RUNNER_TEMP/page-header-log.txt"

      - name: Export the screenshots
        if: always()
        env:
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/page-header.xcresult" --output-path "$RUNNER_TEMP/shots" || true
          for log in "$RUNNER_TEMP"/page-header-*-log.txt "$RUNNER_TEMP"/page-header-install-check.txt; do
            if [[ -f "$log" ]]; then cp "$log" "$RUNNER_TEMP/shots/"; fi
          done
          if [[ "$RENDER_OUTCOME" != success ]]; then
            mkdir -p "$RUNNER_TEMP/shots/diagnostics"
            if [[ -d "$RUNNER_TEMP/page-header.xcresult" ]]; then
              xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/page-header.xcresult" --format json > "$RUNNER_TEMP/shots/diagnostics/test-summary.json" 2>&1 || true
              xcrun xcresulttool export diagnostics --path "$RUNNER_TEMP/page-header.xcresult" --output-path "$RUNNER_TEMP/shots/diagnostics/xcresult" > "$RUNNER_TEMP/shots/diagnostics/xcresult-export.txt" 2>&1 || true
            fi
            if [[ -n "$SIMULATOR_UDID" ]]; then
              xcrun simctl list devices --json > "$RUNNER_TEMP/shots/diagnostics/simulator-devices.json" 2>&1 || true
              xcrun simctl get_app_container "$SIMULATOR_UDID" app.playarr.ios app > "$RUNNER_TEMP/shots/diagnostics/installed-app-container.txt" 2>&1 || true
              xcrun simctl spawn "$SIMULATOR_UDID" log show --last 10m --style compact --predicate 'process == "SpringBoard" OR process == "Playarr" OR process == "Runner" OR process == "xctest"' > "$RUNNER_TEMP/shots/diagnostics/simulator-launch.log" 2>&1 || true
            fi
          fi

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: page-header-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete the test simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        env:
          STATE_simulator_udid: ${{ steps.simulator.outputs.udid }}
        run: node .github/scripts/apple-test-simulator/cleanup.js
