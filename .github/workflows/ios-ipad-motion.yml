name: iPad motion and keyboard focus capture

# Drives the iPad app with a hardware keyboard (Tab, arrows), swipes panels to their end and shows and hides the player
# controls, attaching a frame after every step. GitHub-hosted macOS runners only; manual runs.

on:
  # Runs on a pull request only when the runner or the test itself changes; otherwise manual.
  pull_request:
    paths:
      - .github/workflows/ios-ipad-motion.yml
      - clients/ios/Tests/PlayarrAppUITests/IPadMotionUITests.swift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipad-motion-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  PLAYARR_TEST_SERVER_URL: ${{ secrets.PLAYARR_TEST_SERVER_URL }}

jobs:
  capture:
    name: iPad motion capture
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare the CocoaPods workspace
        run: bash clients/ios/scripts/prepare.sh

      - name: Pick the simulator device
        id: pick
        env:
          KIND: ipad
        run: |
          xcrun simctl list devicetypes
          xcrun simctl list runtimes
          # Query the installed iOS device types: an iPhone with a Dynamic Island, or the largest iPad.
          name=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, os, sys
          names = [d["name"] for d in json.load(sys.stdin)["devicetypes"] if d["identifier"].startswith("com.apple.CoreSimulator.SimDeviceType.")]
          if os.environ["KIND"] == "iphone":
              pick = [n for n in names if n == "iPhone 17"] or [n for n in names if n.startswith("iPhone 17") and "e" != n[-1]]
          else:
              pick = [n for n in names if n.startswith("iPad Air 13-inch")] or [n for n in names if n.startswith("iPad") and "GB" not in n]
          print(sorted(pick)[-1])
          ')
          echo "Using $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create an isolated test simulator
        id: simulator
        env:
          INPUT_DESTINATION: platform=iOS Simulator,name=${{ steps.pick.outputs.name }}
        run: node .github/scripts/apple-test-simulator/main.js

      - name: Resolve the pinned direct-play fixture
        id: fixture
        run: |
          file=$(node -e 'const s=require("./scripts/parity/suite.json"); const f=s.performance?.[0]?.file; if (!/^[0-9a-f-]{36}$/i.test(f ?? "")) process.exit(1); process.stdout.write(f)')
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # Tab and the arrows only move focus between controls when Full Keyboard Access is on; the frames of the first run
      # were identical for every key. Turn it on in the device's accessibility domain and restart the device.
      - name: Enable Full Keyboard Access
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write com.apple.Accessibility FullKeyboardAccessEnabled -bool true
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write com.apple.Accessibility KeyboardAccessEnabled -bool true
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write -g AppleKeyboardUIMode -int 3
          xcrun simctl shutdown "$SIMULATOR_UDID"

      - name: Drive the keyboard and render the frames
        working-directory: clients/ios
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_RUNNER_PLAYARR_KEYBOARD_FOCUS: "1"
          TEST_RUNNER_PLAYARR_UI_TEST_SERVER_URL: ${{ env.PLAYARR_TEST_SERVER_URL }}
          TEST_RUNNER_PLAYARR_UI_TEST_USERNAME: ${{ secrets.PLAYARR_DEVICE_TEST_USERNAME }}
          TEST_RUNNER_PLAYARR_UI_TEST_PASSWORD: ${{ secrets.PLAYARR_DEVICE_TEST_PASSWORD }}
          TEST_RUNNER_PLAYARR_TEST_SERVER_URL: ${{ env.PLAYARR_TEST_SERVER_URL }}
          TEST_RUNNER_PLAYARR_DEVICE_TEST_USERNAME: ${{ secrets.PLAYARR_DEVICE_TEST_USERNAME }}
          TEST_RUNNER_PLAYARR_DEVICE_TEST_EXPECTED_USERNAME: ${{ secrets.PLAYARR_DEVICE_TEST_USERNAME }}
          TEST_RUNNER_PLAYARR_DEVICE_TEST_PASSWORD: ${{ secrets.PLAYARR_DEVICE_TEST_PASSWORD }}
          TEST_RUNNER_PLAYARR_DEVICE_TEST_PLAY_FILE: ${{ steps.fixture.outputs.file }}
        run: |
          : "${PLAYARR_TEST_SERVER_URL:?PLAYARR_TEST_SERVER_URL secret is required}"
          set -euo pipefail
          [[ "$SIMULATOR_UDID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          xcodebuild test -test-timeouts-enabled NO -scheme PlayarrApp -configuration Debug \
            -only-testing:PlayarrAppUITests/KeyboardFocusUITests -only-testing:PlayarrAppUITests/IPadMotionUITests \
            -resultBundlePath "$RUNNER_TEMP/keyboard.xcresult" \
            -workspace "$GITHUB_WORKSPACE/clients/ios/Playarr.xcworkspace" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" 2>&1 | tee "$RUNNER_TEMP/keyboard-log.txt"
          grep -Fq "IPadMotionUITests testHomeScrollBursts]' passed" "$RUNNER_TEMP/keyboard-log.txt"

      - name: Export the screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/keyboard.xcresult" --output-path "$RUNNER_TEMP/shots" || true

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipad-motion
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete the test simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        env:
          STATE_simulator_udid: ${{ steps.simulator.outputs.udid }}
        run: node .github/scripts/apple-test-simulator/cleanup.js
