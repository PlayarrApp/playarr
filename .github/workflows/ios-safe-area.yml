name: iOS safe-area capture

# Renders the main screens on a notched iPhone (portrait and landscape) and an iPad with the real safe-area insets and
# uploads the screenshots (xcresult attachments exported as PNG). The UI test also asserts the navigation and back
# button clear the Dynamic Island, the notch side and the home indicator. GitHub-hosted macOS runners only.

on:
  pull_request:
    paths:
      - clients/ios/**
      - .github/workflows/ios-safe-area.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-safe-area-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  capture:
    name: Safe-area capture (${{ matrix.device }})
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare the CocoaPods workspace
        run: bash clients/ios/scripts/prepare.sh

      - name: Pick the simulator device
        id: pick
        env:
          KIND: ${{ matrix.device }}
        run: |
          xcrun simctl list devicetypes
          xcrun simctl list runtimes
          # Query the installed iOS device types: an iPhone with a Dynamic Island, or the largest iPad.
          name=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, os, sys
          names = [d["name"] for d in json.load(sys.stdin)["devicetypes"] if d["identifier"].startswith("com.apple.CoreSimulator.SimDeviceType.")]
          if os.environ["KIND"] == "iphone":
              pick = [n for n in names if n == "iPhone 17"] or [n for n in names if n.startswith("iPhone 17") and "e" != n[-1]]
          else:
              pick = [n for n in names if n.startswith("iPad Air 13-inch")] or [n for n in names if n.startswith("iPad") and "GB" not in n]
          print(sorted(pick)[-1])
          ')
          echo "Using $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create an isolated test simulator
        id: simulator
        env:
          INPUT_DESTINATION: platform=iOS Simulator,name=${{ steps.pick.outputs.name }}
        run: node .github/scripts/apple-test-simulator/main.js

      - name: Select the shared direct-play fixture
        id: fixture
        run: echo "file=$(node scripts/parity/apple/direct-play-file.mjs)" >> "$GITHUB_OUTPUT"

      - name: Render the screens
        id: render
        working-directory: clients/ios
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_RUNNER_PLAYARR_SAFE_AREA_CAPTURE: "1"
          TEST_RUNNER_PLAYARR_UI_TEST_SERVER_URL: ${{ secrets.PLAYARR_DEVICE_TEST_SERVER_URL }}
          TEST_RUNNER_PLAYARR_UI_TEST_USERNAME: ${{ secrets.PLAYARR_DEVICE_TEST_USERNAME }}
          TEST_RUNNER_PLAYARR_UI_TEST_PASSWORD: ${{ secrets.PLAYARR_DEVICE_TEST_PASSWORD }}
          TEST_RUNNER_PLAYARR_UI_TEST_PLAY_FILE: ${{ steps.fixture.outputs.file }}
        run: |
          set -euo pipefail
          [[ "$SIMULATOR_UDID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          xcodebuild test -scheme PlayarrApp -configuration Debug \
            -only-testing:PlayarrAppUITests/SafeAreaCaptureUITests \
            -resultBundlePath "$RUNNER_TEMP/safe-area.xcresult" \
            -workspace "$GITHUB_WORKSPACE/clients/ios/Playarr.xcworkspace" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" 2>&1 | tee "$RUNNER_TEMP/safe-area-log.txt"
          grep -Fq "SafeAreaCaptureUITests testScreensClearTheSafeAreas]' passed" "$RUNNER_TEMP/safe-area-log.txt"

      - name: Export the screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/safe-area.xcresult" --output-path "$RUNNER_TEMP/shots" || true

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: safe-area-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 14

      - name: Export failure diagnostics
        if: failure()
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          diagnostics="$RUNNER_TEMP/safe-area-diagnostics"
          mkdir -p "$diagnostics"
          if [[ -d "$RUNNER_TEMP/safe-area.xcresult" ]]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/safe-area.xcresult" --format json > "$diagnostics/test-summary.json" 2>&1 || true
            xcrun xcresulttool export diagnostics --path "$RUNNER_TEMP/safe-area.xcresult" --output-path "$diagnostics/xcresult" > "$diagnostics/xcresult-export.txt" 2>&1 || true
          fi
          if [[ -f "$RUNNER_TEMP/safe-area-log.txt" ]]; then
            cp "$RUNNER_TEMP/safe-area-log.txt" "$diagnostics/xcodebuild.log"
          fi
          if [[ -n "$SIMULATOR_UDID" ]]; then
            xcrun simctl list devices --json > "$diagnostics/simulator-devices.json" 2>&1 || true
            xcrun simctl get_app_container "$SIMULATOR_UDID" app.playarr.ios app > "$diagnostics/installed-app-container.txt" 2>&1 || true
            xcrun simctl spawn "$SIMULATOR_UDID" log show --last 10m --style compact --predicate 'process == "SpringBoard" OR process == "Playarr" OR process == "Runner" OR process == "xctest"' > "$diagnostics/simulator.log" 2>&1 || true
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: safe-area-diagnostics-${{ strategy.job-index }}
          path: ${{ runner.temp }}/safe-area-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete the test simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        env:
          STATE_simulator_udid: ${{ steps.simulator.outputs.udid }}
        run: node .github/scripts/apple-test-simulator/cleanup.js
