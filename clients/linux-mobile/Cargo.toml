[package]
name = "playarr-linux-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Native Playarr client for Linux phones (GTK4 + libadwaita, GStreamer)"
license = "MIT"
publish = false

[[bin]]
name = "playarr-mobile"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
gstreamer = "0.25"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }

[profile.release]
lto = "thin"
strip = true
